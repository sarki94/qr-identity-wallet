[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qrw-core"
version = "0.1.0"
description = "Cryptographic core of the Offline-First QR Identity Wallet (COEN838 Q4)"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "flake8>=7", "bandit>=1.7"]

[tool.setuptools.packages.find]
include = ["qrw_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["req(*ids): requirement IDs (FR/NFR) this test verifies, used to build the RTM"]
