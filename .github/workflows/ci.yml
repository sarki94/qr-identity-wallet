name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core tests, coverage and static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (Flake8)
        run: flake8 qrw_core tests
      - name: SAST (Bandit)
        run: bandit -r qrw_core -f txt
      - name: Unit + property-based tests (pytest + Hypothesis) with coverage
        run: pytest --cov=qrw_core --cov-report=term-missing --cov-report=xml --cov-fail-under=90 --junitxml=test-results.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-evidence
          path: |
            core/coverage.xml
            core/test-results.xml

  services:
    name: Service, integration and system tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ./core -e "./services[dev]"
      - name: Lint (Flake8)
        working-directory: services
        run: flake8 qrw_services tests
      - name: SAST (Bandit)
        working-directory: services
        run: bandit -r qrw_services -f txt
      - name: Dependency audit (pip-audit)
        run: pip install pip-audit && pip-audit --skip-editable
      - name: API, integration and end-to-end tests with coverage
        working-directory: services
        run: pytest --cov=qrw_services --cov-report=term-missing --cov-fail-under=90 --junitxml=test-results.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: services-test-evidence
          path: services/test-results.xml

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t qrw-services .

  web:
    name: Web app type-check, cross-language tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Dependency audit of shipped packages (npm audit)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Type-check (TypeScript strict)
        run: npx tsc --noEmit
      - name: Cross-language tests (Python-issued vectors verified in the browser library) with coverage
        run: npm run coverage
      - name: Production build (PWA)
        run: npm run build
