name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core tests, coverage and static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (Flake8)
        run: flake8 qrw_core tests
      - name: SAST (Bandit)
        run: bandit -r qrw_core -f txt
      - name: Unit + property-based tests (pytest + Hypothesis) with coverage
        run: pytest --cov=qrw_core --cov-report=term-missing --cov-report=xml --cov-fail-under=90 --junitxml=test-results.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-evidence
          path: |
            core/coverage.xml
            core/test-results.xml
